{% extends "base.html" %}

{% block title %}Добави новина | NewsHub{% endblock %}

{% block content %}
<section class="panel form-page">
    <h1>{{ form_title }}</h1>

    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ button_text }}</button>
    </form>
</section>
{% endblock %}
