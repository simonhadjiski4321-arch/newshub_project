{% extends "base.html" %}

{% block title %}Изтрий коментар | NewsHub{% endblock %}

{% block content %}
<section class="panel">
    <h1>Изтриване на коментар</h1>
    <p>Сигурен ли си, че искаш да изтриеш коментара от {{ comment.author_name }}?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, изтрий</button>
    </form>

    <p>
        <a href="{% url 'news:article_detail' comment.article_id %}">Отказ</a>
    </p>
</section>
{% endblock %}
